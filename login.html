<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GO FIT - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0e7682;
      --card:#222526;
      --card-2:#1d2021;
      --text:#e9f1f2;
      --muted:#9fb1b6;
      --primary:#2eb4c2;
      --primary-2:#2497a3;
      --danger:#ff6b6b;
      --border:rgba(255,255,255,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(46,180,194,.25), transparent 60%) , linear-gradient(135deg, #0b5e68, #0a4951 45%, #083c42);
      display:grid; place-items:center; padding:24px;
    }
    .card{
      width:100%; max-width:520px;
      background:linear-gradient(180deg, var(--card), var(--card-2));
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    header{
      text-align:center; padding:28px 24px 8px;
    }
    .logo{
      width:56px;height:56px;border-radius:14px;
      display:grid;place-items:center;margin:0 auto 12px;
      background: radial-gradient(circle at 30% 25%, #ffd36a, #ffb43b 60%);
      box-shadow: 0 6px 22px rgba(255,180,60,.25);
    }
    h1{margin:0 0 6px; font-size:28px; font-weight:700; letter-spacing:.3px;}
    .sub{margin:0;color:var(--muted); font-size:14px}

    .tabs{
      display:flex; gap:8px; justify-content:center;
      padding:16px 24px 0;
      border-top:1px solid var(--border);
    }
    .tab{
      background:transparent; color:var(--muted);
      border:none; padding:10px 16px; cursor:pointer;
      font-weight:600; border-bottom:2px solid transparent;
    }
    .tab.active{ color:var(--text); border-color:var(--primary) }

    .content{ padding:22px 24px 26px }
    .form{ display:none; }
    .form.active{ display:block; animation:fade .18s ease-out }
    @keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }

    label{ display:block; margin:0 0 8px; font-size:13px; color:var(--muted) }
    .field{
      width:100%; padding:14px 14px; border-radius:12px;
      background:#161819; border:1px solid var(--border); color:var(--text);
      outline:none; transition:border .15s, box-shadow .15s;
    }
    .field:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(46,180,194,.15) }
    .row{ margin-bottom:16px }

    .actions{ display:flex; gap:12px; align-items:center; justify-content:space-between }
    .btn{
      appearance:none; cursor:pointer; border:none; border-radius:12px;
      padding:12px 16px; font-weight:700; letter-spacing:.3px;
      background:var(--primary); color:#042b2f;
      box-shadow:0 6px 18px rgba(46,180,194,.25);
      transition:transform .05s ease, background .15s;
      width:100%;
    }
    .btn:hover{ background:var(--primary-2) }
    .btn:active{ transform:translateY(1px) }
    .btn-secondary{
      background:#2a2d2e; color:var(--text); box-shadow:none; border:1px solid var(--border)
    }
    .hint{ text-align:right; margin-top:8px }
    .hint a{ color:var(--muted); text-decoration:none; font-size:12px }
    .hint a:hover{ color:var(--text) }

    .divider{
      display:flex; align-items:center; gap:12px; color:var(--muted);
      margin:16px 0;
    }
    .divider::before,.divider::after{
      content:""; flex:1; height:1px; background:var(--border);
    }

    .social{
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    .social-btn{
      display:flex; align-items:center; justify-content:center; gap:10px;
      background:#171a1b; border:1px solid var(--border); color:var(--text);
      padding:12px 14px; border-radius:12px; cursor:pointer; font-weight:600;
    }
    .note{ color:var(--muted); font-size:12px; margin-top:14px; text-align:center }
    @media (max-width:520px){
      .content{ padding:18px 16px 20px }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">💪</div>
      <h1>GO FIT</h1>
      <p class="sub">Track your fitness journey</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab(event,'login')">Login</button>
      <button class="tab" onclick="switchTab(event,'signup')">Sign Up</button>
    </div>

    <div class="content">
      <!-- LOGIN -->
      <div id="login" class="form active">
        <div class="row">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" class="field" placeholder="Enter your email">
        </div>
        <div class="row">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" class="field" placeholder="Enter your password">
          <div class="hint"><a href="#" onclick="alert('Reset coming soon');return false;">Forgot password?</a></div>
        </div>
        <div class="row">
          <button class="btn" onclick="fakeLogin()">Login</button>
        </div>

        <div class="divider">OR</div>

        <div class="social">
          <button class="social-btn" onclick="alert('Google login (demo)');">
            <span>🔵</span> Google
          </button>
          <button class="social-btn" onclick="alert('Facebook login (demo)');">
            <span>🟦</span> Facebook
          </button>
        </div>
        <p class="note">Demo version: actions happen on this device only.</p>
      </div>

      <!-- SIGNUP -->
      <div id="signup" class="form">
        <div class="row">
          <label for="signupName">Full Name</label>
          <input id="signupName" type="text" class="field" placeholder="Enter your full name">
        </div>
        <div class="row">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" class="field" placeholder="Enter your email">
        </div>
        <div class="row">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" class="field" placeholder="Create a password (min 6 chars)">
        </div>
        <div class="row">
          <label for="signupConfirm">Confirm Password</label>
          <input id="signupConfirm" type="password" class="field" placeholder="Confirm your password">
        </div>
        <div class="row actions">
          <button class="btn" onclick="fakeSignup()">Create Account</button>
          <button class="btn btn-secondary" onclick="switchTabFromLink('login')">Back to Login</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tabs
    function switchTab(e, id){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
      if(e) e.currentTarget.classList.add('active');
      document.getElementById(id).classList.add('active');
    }
    function switchTabFromLink(id){
      const i = id==='login'?0:1;
      document.querySelectorAll('.tab')[i].click();
    }

    // Demo login/signup (no database)
    function fakeLogin(){
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      if(!email || !pass){ alert('Enter your email and password'); return; }
      if(pass.length < 6){ alert('Password must be at least 6 characters'); return; }
      // simulate success
      sessionStorage.setItem('currentUserEmail', email);
      location.href = 'index.html';
    }

    function fakeSignup(){
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const p1 = document.getElementById('signupPassword').value.trim();
      const p2 = document.getElementById('signupConfirm').value.trim();
      if(!name || !email || !p1 || !p2){ alert('Fill all fields'); return; }
      if(p1.length < 6){ alert('Password must be at least 6 characters'); return; }
      if(p1 !== p2){ alert('Passwords do not match'); return; }
      alert('Account created (demo). You can now login.');
      switchTabFromLink('login');
      document.getElementById('loginEmail').value = email;
    }
  </script>
</body>
</html>
